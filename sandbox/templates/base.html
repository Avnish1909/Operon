<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}{% endblock %} · {{ system_name }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="theme-{{ theme }}">
<header class="topbar">
  <span class="brand">{{ system_name }}</span>
  {% if user %}
  <nav>{% block nav %}{% endblock %}</nav>
  <form method="post" action="{{ logout_url }}" class="signout">
    <span>Signed in as {{ user }}</span> <button type="submit">Sign out</button>
  </form>
  {% endif %}
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
  {% for cat, msg in messages %}<div class="flash flash-{{ cat }}" role="alert">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
