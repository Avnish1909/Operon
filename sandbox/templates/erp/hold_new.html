{% extends "erp/layout.html" %}
{% block title %}New AP hold{% endblock %}
{% block content %}
<h1>Place invoice on AP hold</h1>
{% for e in errors %}<div class="flash flash-error" role="alert">{{ e }}</div>{% endfor %}
<form method="post">
  <label for="vendor_id">Vendor</label>
  <select id="vendor_id" name="vendor_id">
    <option value="">-- select vendor --</option>
    {% for v in vendors %}<option value="{{ v.id }}" {% if form.vendor_id == v.id %}selected{% endif %}>{{ v.name }}</option>{% endfor %}
  </select>
  <label for="vendor_invoice_no">Vendor invoice number</label>
  <input id="vendor_invoice_no" name="vendor_invoice_no" value="{{ form.vendor_invoice_no }}">
  <label for="po_number">PO number (if any)</label>
  <input id="po_number" name="po_number" value="{{ form.po_number }}">
  <label for="amount">Invoice amount (USD)</label>
  <input id="amount" name="amount" value="{{ form.amount }}" inputmode="decimal">
  <label for="reason">Hold reason</label>
  <select id="reason" name="reason">
    <option value="">-- choose --</option>
    {% for r in reasons %}<option {% if form.reason == r %}selected{% endif %}>{{ r }}</option>{% endfor %}
  </select>
  <label for="details">Details</label>
  <textarea id="details" name="details" rows="3">{{ form.details }}</textarea>
  <button type="submit">Place on hold</button>
</form>
{% endblock %}
