# Action catalog — policy as code.
#
# Every state-changing request (POST/PUT/PATCH/DELETE) the operator sends to a company system —
# whether by clicking in the browser or through an API — is matched against this catalog at the
# network boundary and gets a decision: allow, require_approval or deny. The model cannot talk its
# way past it: a held request is never sent until a human approves that exact action.
#
# params:  values extracted from the request — path.<name>, body.<field>, query.<field>,
#          or a list of those (concatenated into one list).
# money:   params parsed as dollar amounts ("$1,234.50" -> 1234.5).
# rules:   evaluated top to bottom, first match wins; no match -> allow.
#          when: {param, op, value} with op in gt, gte, lt, lte, eq, ne, contains_any, any_not_endswith.
# readonly_safe: allowed even in read-only mode (used by the independent verifier).
# approval_keys: the params an approval is bound to (default: all params). An approval is single-use:
#          it is spent when the system accepts the request, and given back if the system rejects it.

defaults:
  unknown_write: require_approval
  unknown_write_approver: operations_lead

actions:
  # ------------------------------------------------------------------ sign-in / sign-out
  - id: erp.sign_in
    match: {method: POST, path: /erp/login}
    summary: Sign in to the ERP
    readonly_safe: true
  - id: erp.sign_out
    match: {method: POST, path: /erp/logout}
    summary: Sign out of the ERP
    readonly_safe: true
  - id: desk.sign_in
    match: {method: POST, path: /desk/login}
    summary: Sign in to the helpdesk
    readonly_safe: true
  - id: desk.sign_out
    match: {method: POST, path: /desk/logout}
    summary: Sign out of the helpdesk
    readonly_safe: true
  - id: hr.sign_in
    match: {method: POST, path: /hr/login}
    summary: Sign in to PeoplePort
    readonly_safe: true
  - id: hr.sign_out
    match: {method: POST, path: /hr/logout}
    summary: Sign out of PeoplePort
    readonly_safe: true

  # ------------------------------------------------------------------ ERP
  - id: erp.issue_refund
    match: {method: POST, path: "/erp/payments/{payment_id}/refund"}
    params: {payment_id: path.payment_id, amount: body.amount, reason: body.reason}
    money: [amount]
    approval_keys: [payment_id, amount]
    summary: "Refund ${amount} on payment {payment_id} (reason: {reason})"
    rules:
      - id: APPROVAL-REFUND-FINANCE-ONLY
        when: {param: amount, op: gt, value: 5000}
        decision: deny
        message: Refunds over $5,000.00 are not permitted for operations staff; escalate to Finance.
      - id: APPROVAL-REFUND-250
        when: {param: amount, op: gt, value: 250}
        decision: require_approval
        approver: finance_manager
        message: Refunds over $250.00 require Finance Manager approval.

  - id: erp.delete_customer
    match: {method: POST, path: "/erp/customers/{customer_id}/delete"}
    params: {customer_id: path.customer_id}
    summary: "Delete customer {customer_id}"
    rules:
      - id: DP-4
        decision: deny
        message: >-
          Policy DP-4: operations staff may never delete customer records. Route deletion requests
          to the Data Protection Officer (privacy@northwind.example).

  - id: erp.create_bill
    match: {method: POST, path: /erp/bills/new}
    params: {vendor_id: body.vendor_id, po_number: body.po_number, vendor_invoice_no: body.vendor_invoice_no, amount: body.amount, invoice_date: body.invoice_date}
    money: [amount]
    approval_keys: [vendor_id, po_number, vendor_invoice_no, amount]
    summary: "Enter vendor bill {vendor_invoice_no} for ${amount} against {po_number}"
    rules:
      - id: APPROVAL-BILL-10K
        when: {param: amount, op: gt, value: 10000}
        decision: require_approval
        approver: controller
        message: Vendor bills over $10,000.00 require Controller approval.

  - id: erp.create_ap_hold
    match: {method: POST, path: /erp/ap-holds/new}
    params: {vendor_invoice_no: body.vendor_invoice_no, reason: body.reason, amount: body.amount}
    money: [amount]
    summary: "Place vendor invoice {vendor_invoice_no} on AP hold ({reason})"

  # ------------------------------------------------------------------ Helpdesk (web UI and API)
  - id: desk.reply
    match: {method: POST, path: "/desk/tickets/{ticket_id}/reply"}
    params: {ticket_id: path.ticket_id, internal: body.internal}
    summary: "Post a message on ticket #{ticket_id}"
  - id: desk.set_status
    match: {method: POST, path: "/desk/tickets/{ticket_id}/status"}
    params: {ticket_id: path.ticket_id, status: body.status}
    summary: "Set ticket #{ticket_id} status to {status}"
  - id: desk.api.post_message
    match: {method: POST, path: "/desk/api/tickets/{ticket_id}/messages"}
    params: {ticket_id: path.ticket_id, internal: body.internal}
    summary: "Post a message on ticket #{ticket_id} (internal={internal})"
  - id: desk.api.update_ticket
    match: {method: PATCH, path: "/desk/api/tickets/{ticket_id}"}
    params: {ticket_id: path.ticket_id, status: body.status}
    summary: "Update ticket #{ticket_id} (status={status})"
  - id: desk.api.create_ticket
    match: {method: POST, path: /desk/api/tickets}
    params: {subject: body.subject}
    summary: "Open a new helpdesk ticket: {subject}"

  # ------------------------------------------------------------------ HR
  - id: hr.create_employee
    match: {method: POST, path: /hr/employees/new}
    params: {full_name: body.full_name, title: body.title}
    summary: "Create employee record for {full_name} ({title})"
  - id: hr.grant_access
    match: {method: POST, path: "/hr/employees/{employee_id}/access"}
    params: {employee_id: path.employee_id, entitlements: body.entitlements}
    summary: "Grant {entitlements} to employee {employee_id}"
    rules:
      - id: SEC-PRIVILEGED-ACCESS
        when: {param: entitlements, op: contains_any, value: ["erp:admin", "helpdesk:admin"]}
        decision: require_approval
        approver: it_security
        message: Administrator entitlements require IT Security approval.

  # ------------------------------------------------------------------ Mail
  - id: mail.send
    match: {method: POST, path: /mail/api/send}
    params: {recipients: [body.to, body.cc], subject: body.subject, body: body.body}
    summary: "Send email '{subject}' to {recipients}"
    rules:
      - id: COMMS-EXTERNAL-EMAIL
        when: {param: recipients, op: any_not_endswith, value: "@northwind.example"}
        decision: require_approval
        approver: comms
        message: Email to recipients outside @northwind.example requires Communications approval.
